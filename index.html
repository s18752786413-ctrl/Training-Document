function saveRecord(url,r){try{localStorage.setItem('training-record:'+url,JSON.stringify(r))}catch{}}
function attrSafe(s){return String(s||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function render(){const q=search.value.trim().toLowerCase(),base=cat==='新增文档'?D.filter(x=>x[2]!=='文件夹').slice().sort((a,b)=>(CREATED[b[1]]||'').localeCompare(CREATED[a[1]]||'')):D;const list=base.filter(x=>(cat==='全部'||cat==='新增文档'||x[0]===cat)&&(!q||x.join(' ').toLowerCase().includes(q)));grid.innerHTML=list.map(x=>{const old=/旧版|历史|副本|待加入|待确认|模板/.test(x[3]),r=readRecord(x[4]),sessions=sessionsOf(r),selected=r.selectedTime||sessions.at(-1)?.time||'',current=sessions.find(s=>s.time===selected),id='session-menu-'+encodeURIComponent(x[4]);return `<article class="card ${old?'old':''}"><div class="top"><span class="tag">${x[0]}</span><span class="type">${x[2]}</span></div><h3><a href="${x[4]}" target="_blank" rel="noopener">${x[1]}</a></h3><div class="meta">创建时间：${CREATED[x[1]]||'待补充'} · ${x[2]}</div><div class="note">${x[3]}</div><div class="card-bottom"><a class="open" href="${x[4]}" target="_blank" rel="noopener">打开文档</a><div class="record"><div class="session-count">已培训场次：${sessions.length}场</div><label>培训时间：<span class="time-control"><input autocomplete="off" name="training-time-${attrSafe(id)}" data-role="session-time" data-url="${attrSafe(x[4])}" value="${attrSafe(selected)}" placeholder="自行填写时间"><button class="time-toggle" type="button" data-menu="${attrSafe(id)}" aria-label="查询已保存的培训时间">▾</button></span></label><label>参与人员：<input autocomplete="off" data-role="session-people" data-url="${attrSafe(x[4])}" value="${attrSafe(current?.people||'')}" placeholder="选择时间后查看或填写" aria-label="参与人员" ${selected?'':'disabled'}></label><div class="session-menu" id="${attrSafe(id)}"><div class="session-menu-title">共 ${sessions.length} 场已保存记录</div><input class="session-search" data-role="session-search" placeholder="查询培训时间或参与人员"><div class="session-options">${sessions.length?sessions.map(s=>`<div class="session-option"><button class="session-pick" type="button" data-role="session-pick" data-url="${attrSafe(x[4])}" data-time="${attrSafe(s.time)}"><span>${attrSafe(s.time||'未填写时间')}</span><small>参与人员：${attrSafe(s.people||'未填写')}</small></button><button class="session-delete" type="button" data-role="session-delete" data-url="${attrSafe(x[4])}" data-time="${attrSafe(s.time)}">删除</button></div>`).join(''):'<div class="session-empty">暂无已保存场次</div>'}</div></div></div></div></article>`}).join('');grid.querySelectorAll('[data-role="session-time"]').forEach(i=>i.addEventListener('change',()=>{const url=i.dataset.url,time=i.value.trim(),r=readRecord(url),sessions=sessionsOf(r);r.sessions=sessions;if(time&&!sessions.some(s=>s.time===time))sessions.push({time,people:''});r.selectedTime=time;saveRecord(url,r);render()}));grid.querySelectorAll('[data-role="session-people"]').forEach(i=>i.addEventListener('input',()=>{const url=i.dataset.url,time=[...grid.querySelectorAll('[data-role="session-time"]')].find(t=>t.dataset.url===url)?.value.trim(),r=readRecord(url),sessions=sessionsOf(r);r.sessions=sessions;const session=sessions.find(s=>s.time===time);if(session){session.people=i.value;r.selectedTime=time;saveRecord(url,r)}}));grid.querySelectorAll('.time-toggle').forEach(b=>b.addEventListener('click',()=>{const m=document.getElementById(b.dataset.menu);m.classList.toggle('open');if(m.classList.contains('open'))m.querySelector('.session-search').focus()}));grid.querySelectorAll('[data-role="session-pick"]').forEach(b=>b.addEventListener('click',()=>{const url=b.dataset.url,time=b.dataset.time,r=readRecord(url);r.selectedTime=time;saveRecord(url,r);render()}));grid.querySelectorAll('[data-role="session-delete"]').forEach(b=>b.addEventListener('click',()=>{if(!confirm('确定删除这条培训时间和参与人员记录吗？'))return;const url=b.dataset.url,time=b.dataset.time,r=readRecord(url);r.sessions=sessionsOf(r).filter(s=>s.time!==time);if(r.selectedTime===time)r.selectedTime=r.sessions.at(-1)?.time||'';saveRecord(url,r);render()}));grid.querySelectorAll('[data-role="session-search"]').forEach(i=>i.addEventListener('input',()=>{const q=i.value.trim().toLowerCase();i.closest('.session-menu').querySelectorAll('.session-option').forEach(row=>{row.style.display=row.textContent.toLowerCase().includes(q)?'flex':'none'})}));hint.textContent=cat==='新增文档'?`按创建时间从新到旧显示 ${list.length} / ${base.length} 项文档${q?' · 已筛选':''}`:`显示 ${list.length} / ${D.length} 项资源${cat==='全部'?'':' · 当前分类：'+cat}`;empty.style.display=list.length?'none':'block'}search.addEventListener('input',render);render();
</script></body></html>
